pre-commit:
  jobs:
    - run: npx eslint {staged_files} --fix
      glob: "*.{js,mjs,jsx,ts,tsx}"
      stage_fixed: true
    - run: npx prettier --write {staged_files}
      glob: "*.{js,mjs,jsx,ts,tsx,json,md,yml,yaml}"
      stage_fixed: true

post-checkout:
  jobs:
    - run: pnpm install
      only: pnpm-lock.yaml

post-merge:
  jobs:
    - run: pnpm install
      only: pnpm-lock.yaml

post-rebase:
  jobs:
    - run: pnpm install
      only: pnpm-lock.yaml
