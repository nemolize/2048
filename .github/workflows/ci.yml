name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling an in-progress main run would leave that commit with no CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@9a635df512e1bffb9472b819c6760dc255543849 # v1.0.0
      - run: pnpm run lint

  Test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@9a635df512e1bffb9472b819c6760dc255543849 # v1.0.0
      - id: test
        run: pnpm run test:coverage
      # Keyed on the test step, not the job: a failure before it leaves no report,
      # and the reader's own error would then bury the real one. `!cancelled()`
      # is what stops the implicit `success()` from skipping these on red tests.
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report to the job summary
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          comment-on: none
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        id: table
        name: Render the coverage summary as a table
        run: |
          {
            echo 'markdown<<COVERAGE'
            if [ -f coverage/coverage-summary.json ]; then
              printf '### Coverage\n\n| | metric | %% | covered |\n| --- | --- | --- | --- |\n'
              jq -r '.total as $t
                | ["statements", "branches", "functions", "lines"][] as $m
                | $t[$m]
                | "| \(if .pct >= 90 then "🟢" elif .pct >= 80 then "🟠" else "🔴" end) | \($m) | \(.pct)% | \(.covered)/\(.total) |"' \
                coverage/coverage-summary.json
              printf '\n🟢 90%% and above · 🟠 80–89%% · 🔴 below 80%%\n'
            fi
            echo COVERAGE
          } >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report into the PR description
        uses: nemolize/upsert@173e49a4822af386e19526114249b47aa2888f09 # v1.0.1
        with:
          marker: coverage
          body: ${{ steps.table.outputs.markdown }}
          # A run that failed before writing the summary leaves the last table standing.
          on-empty: skip

  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@9a635df512e1bffb9472b819c6760dc255543849 # v1.0.0
      - run: pnpm run build

  E2ETests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Without --ipc=host chromium can run out of memory and crash.
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # checkout's own safe.directory lasts only for its step; the `prepare`
      # script (`lefthook install`) that `pnpm install` runs needs it too.
      - run: git config --global --add safe.directory "$(pwd)"
      - uses: nemolize/actions/setup@9a635df512e1bffb9472b819c6760dc255543849 # v1.0.0
      - name: Assert the image ships the Playwright version we depend on
        run: |
          img="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion)")"
          pt="$(node -p "require('@playwright/test/package.json').version")"
          pw="$(node -p "require('playwright/package.json').version")"
          if [ "$pt" != "$img" ] || [ "$pw" != "$img" ]; then
            echo "::error::image ships Playwright $img, but @playwright/test is $pt and playwright is $pw; update this job's container image tag to v$pt"
            exit 1
          fi
      - run: pnpm run test:e2e
