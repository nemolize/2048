name: Deploy

# Deliberately not gated on CI: shipping while CI is red has to stay possible.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queueing production keeps a second push from cancelling a live deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        name: Show wip message in the PR description
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ⏳deployment is in progress..."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0

      - run: pnpm run build

      - id: deploy
        name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload' }}

      - if: ${{ github.event_name == 'pull_request' }}
        name: Show preview URL in the PR description
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ${{ steps.deploy.outputs.deployment-url || '⚠️ no URL returned — is the workers.dev subdomain enabled?' }}"

      - if: ${{ failure() && github.event_name == 'pull_request' }}
        name: Show error message in the PR description
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ❌deployment failed."
